name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 release
    runs-on: windows-2022
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild vs2022\SumatraPDF.sln /t:SumatraPDF "/p:Configuration=Release;Platform=x64" /m /v:minimal /nologo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # the same exe: run directly it is the portable app, and with
          # "install" in its name it starts as the installer
          Copy-Item out\rel64\Swiftleaf.exe dist\Swiftleaf.exe
          Copy-Item out\rel64\Swiftleaf.exe dist\Swiftleaf-install.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: swiftleaf-x64
          path: dist/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: swiftleaf-x64
          path: dist

      # what the app's update check reads (UpdateCheck.cpp), via
      # releases/latest/download/update-check.txt
      - name: Write update-check.txt
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha_inst=$(sha256sum dist/Swiftleaf-install.exe | cut -d' ' -f1)
          sha_port=$(sha256sum dist/Swiftleaf.exe | cut -d' ' -f1)
          cat > dist/update-check.txt <<EOF
          [Swiftleaf]
          Latest: ${ver}
          BuiltOn: $(date -u +%Y-%m-%d)
          Installer64: ${base}/Swiftleaf-install.exe
          Sha256Installer64: ${sha_inst}
          PortableExe64: ${base}/Swiftleaf.exe
          Sha256PortableExe64: ${sha_port}
          EOF
          sed -i 's/^ *//' dist/update-check.txt
          cat dist/update-check.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
